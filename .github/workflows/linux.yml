name: Linux

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-smoke:
    name: Linux ${{ matrix.name }}
    runs-on: ubuntu-26.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Debug
            build_type: Debug
          - name: Release
            build_type: Release
          - name: ASan
            build_type: Debug
            sanitize_flags: -fsanitize=address -fno-omit-frame-pointer
          # -fno-sanitize-recover: the first finding stops the game.
          - name: UBSan
            build_type: Debug
            sanitize_flags: -fsanitize=undefined -fno-sanitize-recover=all -fno-omit-frame-pointer
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive

      # libegl-mesa0 / libglx-mesa0 / libgl1-mesa-dri: Mesa EGL, GLX (SDL makes X11 GL windows
      # with GLX) and the llvmpipe software renderer, which Xvfb also needs for GLX.
      - name: Install build tools and libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ninja-build libgles-dev libegl-dev libsdl3-dev libegl-mesa0 libglx-mesa0 libgl1-mesa-dri xvfb xdotool imagemagick

      - name: Configure
        run: >
          cmake -S . -B build-linux -G Ninja
          -DCMAKE_BUILD_TYPE=${{ matrix.build_type }}
          "-DCMAKE_C_FLAGS=${{ matrix.sanitize_flags }}"
          "-DCMAKE_CXX_FLAGS=${{ matrix.sanitize_flags }}"
          "-DCMAKE_EXE_LINKER_FLAGS=${{ matrix.sanitize_flags }}"

      - name: Build
        run: cmake --build build-linux

      - name: GLX diagnostics (temporary)
        continue-on-error: true
        run: |
          sudo apt-get install -y --no-install-recommends mesa-utils x11-utils
          Xvfb :99 -screen 0 1024x768x24 -nolisten tcp &
          sleep 2
          DISPLAY=:99 xdpyinfo | grep -i -A3 'number of extensions' || true
          DISPLAY=:99 xdpyinfo -queryExtensions | grep -i glx || true
          DISPLAY=:99 LIBGL_DEBUG=verbose glxinfo -B || true
          DISPLAY=:99 glxinfo | grep -i -E 'es2_profile|visual' | head -5 || true
          ls /usr/lib/x86_64-linux-gnu/dri/ | head || true
          ls /usr/share/glvnd/egl_vendor.d/ /usr/lib/x86_64-linux-gnu/libGLX_* || true
          kill %1

      - name: Smoke run
        env:
          ASAN_OPTIONS: detect_leaks=0:halt_on_error=1
        run: ci/smoke.sh build-linux/Maple smoke

      - name: Upload screenshots and logs
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: smoke-${{ matrix.name }}
          path: smoke/
          retention-days: 14
